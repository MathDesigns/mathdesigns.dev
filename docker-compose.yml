services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mathlab/svelte-deploy:latest
    container_name: svelte-deploy
    user: "1337"
    environment:
      NODE_ENV: production
      TZ: Europe/Brussels
      HOST: 0.0.0.0
      PORT: "3000"
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
